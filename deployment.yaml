apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agriculture
  annotations:
    kubernetes.io/change-cause: "Release __TAG__"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-agriculture
  template:
    metadata:
      labels:
        app: smart-agriculture
    spec:
      containers:
      - name: smart-agriculture
        image: ayushsksksk/smart-agriculture:__TAG__
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agriculture-service
spec:
  type: NodePort
  selector:
    app: smart-agriculture
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30051
